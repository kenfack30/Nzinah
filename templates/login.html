<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion - Nzinah</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="display: flex; justify-content: center; align-items: center; background-color: #f3f4f6;">
    <div style="background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px;">
        
        <!-- LOGO ET NOM -->
        <div style="text-align: center; margin-bottom: 30px;">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Nzinah" style="width: 60px; height: 60px; object-fit: contain; margin-bottom: 10px;">
            <h2 style="color: #10b981; font-size: 26px; margin: 0; font-weight: 800;">Nzinah</h2>
            <p style="color: #6b7280; font-size: 12px; margin-top: 5px;">L'Excellence de votre Réputation</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div style="padding: 10px; margin-bottom: 20px; border-radius: 5px; font-weight: bold; background-color: {% if category == 'error' %}#fee2e2{% else %}#d1fae5{% endif %}; color: {% if category == 'error' %}#ef4444{% else %}#10b981{% endif %};">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <h3 style="text-align: center; margin-bottom: 20px; color: #374151;">Connexion</h3>
        
        <form method="POST">
            <div class="form-group">
                <input type="email" name="email" placeholder="Adresse email" required style="width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #d1d5db; border-radius: 8px;">
            </div>
            <div class="form-group">
                <input type="password" name="password" placeholder="Mot de passe" required style="width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #d1d5db; border-radius: 8px;">
            </div>
            <div style="margin-bottom: 20px; display: flex; align-items: center;">
                <input type="checkbox" name="remember" id="remember" style="margin-right: 10px; width: 16px; height: 16px;">
                <label for="remember" style="font-size: 14px; color: #4b5563;">Se souvenir de moi</label>
            </div>
            <button type="submit" class="btn-primary" style="width: 100%; padding: 12px;">Se connecter</button>
        </form>
        
        <p style="text-align: center; margin-top: 20px; font-size: 14px; color: #4b5563;">
            Pas encore de compte ? <a href="{{ url_for('inscription') }}" style="color: #10b981; text-decoration: none; font-weight: bold;">Inscrivez-vous</a>
        </p>
    </div>
</body>
</html>
