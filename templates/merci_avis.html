<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merci pour votre avis !</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; text-align: center; }
        .card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-width: 400px; width: 100%; }
        h1 { color: #10b981; font-size: 28px; margin-bottom: 15px; }
        p { color: #4b5563; font-size: 16px; line-height: 1.5; }
        .logo { font-size: 14px; color: #9ca3af; margin-top: 30px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Merci ! 🎉</h1>
        <p>Votre retour a bien été transmis à <strong>{{ nom_entreprise }}</strong>.</p>
        <p style="font-size: 14px; color: #6b7280;">Ils vous en sont très reconnaissants.</p>
        <div class="logo">Propulsé par Nzinah</div>
    </div>
</body>
</html>
